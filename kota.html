<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://diyanet-awqat-salah.ertantan-tr.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark">
<title>Diyanet Kota</title>
<link rel="stylesheet" href="kota.css">
</head>
<body>
<main id="app" aria-busy="false">
  <header>
    <h1>Diyanet Kota</h1>
  </header>

  <div class="card">
    <label for="ilSel">İl</label>
    <div class="bar">
      <select id="ilSel" aria-label="İl seç"></select>
      <button type="button" id="refreshBtn">Yenile</button>
    </div>
    <div class="row">
      <button type="button" class="ghost" id="keyBtn">Şifre</button>
    </div>
  </div>

  <form id="keyForm" class="card" autocomplete="off" hidden>
    <label for="keyInput">Kota şifresi (KOTA_KEY)</label>
    <input id="keyInput" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <label class="chk"><input type="checkbox" id="showKey"> Şifreyi göster</label>
    <div class="row">
      <button type="submit">Kaydet ve göster</button>
      <button type="button" class="ghost" id="clearKeyBtn" hidden>Şifreyi sil</button>
    </div>
  </form>

  <div id="msg" role="status" aria-live="polite" hidden></div>
  <div id="loading" hidden>Yükleniyor…</div>

  <section id="report" hidden>
    <h2>Diyanet Kota Durumu</h2>
    <div id="cards"></div>
  </section>

  <div class="foot">
    <span id="stamp" class="pill"></span>
    <a id="backLink" class="pill back" href="./">← Uygulamaya Dön</a>
  </div>
</main>

<script src="kota.js" defer></script>
</body>
</html>
